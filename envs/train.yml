# Training environment (GPU): INSPIRE / FGW training, encoding, Leiden metrics (evaluate, nmi_within).
# Versions of the environment the results were produced with.
name: ottr-train
channels: [conda-forge, pytorch, nvidia]
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.3.3
      - scikit-learn==1.7.2
      - torch==2.5.1          # CUDA 12.1 build: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
      - POT==0.9.5
      - scanpy==1.11.5
      - anndata==0.9.2
      - umap-learn==0.5.12
      - harmonypy==2.0.2
      - igraph==1.0.0
      - leidenalg==0.12.0
      - matplotlib==3.10.9
      - h5py==3.16.0
      - PyYAML==6.0.3
      - tqdm
      - pytest
